name: Python SDK CI

on:
  pull_request:
    paths:
      - 'sdk/python/**'
      - 'docs/harness-providers.md'
      - '.github/workflows/sdk-python.yml'
  push:
    branches: [main]
    paths:
      - 'sdk/python/**'
      - 'docs/harness-providers.md'
      - '.github/workflows/sdk-python.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]
          # Pinned: ruff 0.16.0 flags ~2700 pre-existing violations (I001,
          # BLE001, C408, ...) repo-wide; bump deliberately alongside the fixes.
          python -m pip install "ruff==0.15.22"

      - name: Lint
        working-directory: sdk/python
        run: |
          ruff check .

      - name: Targeted Pyright
        working-directory: sdk/python
        run: |
          pyright --pythonpath "$(python -c 'import sys; print(sys.executable)')" \
            agentfield/harness/providers/opencode.py \
            agentfield/harness/_profiles.py \
            agentfield/harness/_runner.py \
            agentfield/types.py \
            tests/test_harness_profiles.py \
            tests/test_harness_agent_wiring.py

      - name: Documentation check
        run: rumdl check --disable MD013 docs/harness-providers.md

      - name: Format (auto-fix)
        working-directory: sdk/python
        run: |
          ruff format .
        continue-on-error: true

      - name: Run tests
        working-directory: sdk/python
        run: ./scripts/run_pytest.sh

  opencode-capability:
    name: OpenCode 1.18.21 capability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned OpenCode CLI
        run: npm install --global opencode-ai@1.18.21

      - name: Verify executable profile surface
        run: |
          python sdk/python/scripts/check_opencode_capabilities.py \
            --expected-version 1.18.21

  # Verify websockets version compatibility (v14 renamed extra_headers → additional_headers)
  websockets-compat:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        websockets-version: ['12.0', '15.0.1']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
          pip install websockets==${{ matrix.websockets-version }}

      - name: Verify websockets version
        run: python -c "import websockets; print(f'websockets {websockets.__version__}')"

      - name: Run memory events tests
        working-directory: sdk/python
        run: ./scripts/run_pytest.sh tests/test_memory_events.py -v --no-cov

  # Summary job that depends on all critical checks
  required-checks:
    name: All Required Checks Passed
    runs-on: ubuntu-latest
    needs: [lint-and-test, websockets-compat, opencode-capability]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [ "${{ needs.lint-and-test.result }}" != "success" ]; then
            echo "lint-and-test failed"
            exit 1
          fi
          if [ "${{ needs.websockets-compat.result }}" != "success" ]; then
            echo "websockets-compat failed"
            exit 1
          fi
          if [ "${{ needs.opencode-capability.result }}" != "success" ]; then
            echo "opencode-capability failed"
            exit 1
          fi
          echo "All required checks passed successfully"
